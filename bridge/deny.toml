# cargo-deny configuration for the bridge.
#
# Two gates an enterprise review asks about, answered continuously instead of
# at audit time:
#   - advisories: the dependency tree is checked against the RUSTSEC database
#     on every bridge change; a known vulnerability fails the build.
#   - licenses: only the permissive families already inventoried in
#     THIRD-PARTY-LICENSES.md are allowed; any copyleft creep fails the build
#     before it can reach the notice.

[graph]
targets = [{ triple = "aarch64-apple-darwin" }]

[advisories]
version = 2

[licenses]
version = 2
# The bridge itself is proprietary and unpublished; the allowlist governs the
# third-party tree, not our own crate.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "ISC",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Unlicense",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
