# Runs the hook tests before merge.
#
# The hooks, the live watcher and the launcher that starts them are part of the
# bridge binary now, so their tests are the bridge's own Rust tests: the probe's
# wire protocol against a stand-in desktop, which edits reach the agent and which
# reach the user, the once-per-change gates, the watcher's idle ladder, and the
# wiring that registers every hook with every host. This gate runs them when a
# plugin file they read changes outside bridge/ (test-bridge.yml covers bridge/).
#
# CI may use any toolchain. What it guards is the opposite property on the
# user's machine: nothing there needs more than /bin/sh and the shipped binary.
name: Test hooks

on:
  pull_request:
    paths:
      - 'hooks/**'
      - 'bin/designless'
      - '.mcp.json'
      - '.mcp.codex.json'
      - '.mcp.cursor.json'
      - 'commands/**'
      - 'skills/**'
      - '.github/workflows/test-hooks.yml'
  merge_group:
  push:
    branches: [main]
    paths:
      - 'hooks/**'
      - 'bin/designless'
      - '.mcp.json'
      - '.mcp.codex.json'
      - '.mcp.cursor.json'
      - 'commands/**'
      - 'skills/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Launcher parses as POSIX sh
        run: sh -n bin/designless
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge
      # Inside bridge/, so its rust-toolchain.toml pins the compiler.
      - name: Tests
        working-directory: bridge
        run: cargo test --all-features
