# Runs the bridge's tests and lints before merge.
#
# build-bridge.yml covers the release path: it compiles on push to main and on a
# manual dispatch. This is the pre-merge half — the frame-contract tests matter
# most on a pull request, because a change to how a reply is parsed is invisible
# in a diff and only shows up when a desktop build the bridge has never seen
# sends something new.
#
name: Test bridge

on:
  pull_request:
    paths:
      - 'bridge/**'
      - '.github/workflows/test-bridge.yml'
  merge_group:
  push:
    branches: [main]
    paths:
      - 'bridge/**'

jobs:
  test:
    # ubuntu, deliberately. The release path is macOS-arm64-only because that is
    # where the binary ships, but nothing under test here is platform-specific —
    # frame parsing and error mapping — and a cheap runner that always has
    # capacity is what keeps a pre-merge gate from being the slow step people
    # learn to skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge

      - name: Tests
        run: cargo test --manifest-path bridge/Cargo.toml --all-features

      # Warnings are errors here. The bridge is small and its warnings have been
      # zero; letting the first one land is how a wall of them starts.
      - name: Lints
        run: cargo clippy --manifest-path bridge/Cargo.toml --all-targets -- -D warnings

  # Supply-chain gate: RUSTSEC advisories and a license allowlist over the exact
  # dependency tree the binary ships. The allowlist mirrors the families in
  # THIRD-PARTY-LICENSES.md, so copyleft creep or a known vulnerability fails a
  # pull request instead of surfacing in someone's procurement review.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: bridge/Cargo.toml
