name: Markdown contracts

# One gate runs here: version parity across every door.
#
# It is the only check that belongs in this repo's CI, because it is the only
# one whose subject is already public. Designless installs into more than one
# editor, each manifest carries its own version, and "they all agree" is a fact
# a customer could read off the tarball anyway.
#
# Everything else lives in scripts/, which is gitignored. That is not a
# preference — this repo's install tarball is the WHOLE committed tree, so a
# check committed here also lands on every customer's disk, and a contract
# check tends to record why it was written, which is exactly the material that
# must not ship. release.mjs runs those instead: later than a pull request,
# still before any customer.

on:
  push:
    branches: [main]
    # Version tags run the same gate: a tag that disagrees with the tree it
    # points at is a release that never happened.
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: One version, every door (all manifests agree; tags match the tree)
        run: node .github/checks/check-one-version.mjs
